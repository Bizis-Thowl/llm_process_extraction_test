[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process-extraction"
version = "0.1.0"
description = "LLM-based process extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.21.0",
    "instructor>=1.14.5",
    "python-dotenv>=1.2.1",
    "arize-phoenix>=13.7",
    "openinference-instrumentation-openai>=0.1",
    "jupyter",
    "graphrag",
]

[project.optional-dependencies]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/process_extraction"]
