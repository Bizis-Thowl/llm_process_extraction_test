[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process-extraction"
version = "0.1.0"
description = "LLM-based process extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.21.0",
    "instructor>=1.14.5",
    "python-dotenv>=1.2.1",
    "arize-phoenix>=13.7",
    "openinference-instrumentation-openai>=0.1",
    "jupyter",
    "graphrag",
    "langchain-text-splitters>=1.1.1",
    "pandas>=2.3.3",
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "langchain-mongodb>=0.11.0",
    "pymongo>=4.16.0",
]

[project.optional-dependencies]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/process_extraction","src/doc_retrieval"]
